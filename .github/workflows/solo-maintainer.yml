name: Solo maintainer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This repository is maintained by one person. The safety mechanism is an
# auditable automated check, not a required self-review or CODEOWNERS approval.
permissions:
  contents: read

concurrency:
  group: solo-maintainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-boundary:
    name: template-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check consumer contract
        run: pnpm typecheck

      - name: Check content tests
        run: pnpm test
