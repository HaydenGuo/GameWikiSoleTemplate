# Fork setup — one-click initialization after forking GameWikiSoleTemplate.
#
# Run this ONCE from your fork's Actions tab ("Initialize GameWikiSoleTemplate" → Run workflow).
# Safe-to-automate, non-interactive steps only:
#   1. Create a Vercel .env.example with your domain + blank optional integrations
#   2. Remove the project landing page (fork users don't need it)
#   3. Optionally clear the demo game content (default: yes)
#   4. Open a PR with the changes for you to review
#
# What this does NOT do (run `pnpm apply-template` locally for these):
#   game name / theme color / locales / homepage copy — see docs/apply-template.md.
#
# After merging: import the repository into Vercel (docs/deployment.md).

name: Initialize GameWikiSoleTemplate

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Your site domain (https:// added automatically if missing), e.g. https://mygame.wiki'
        required: true
        default: 'https://your-domain.wiki'
      clear_demo_content:
        description: 'Delete the demo game articles (Anvil Quest) so your site starts clean'
        required: false
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create Vercel environment example
        env:
          RAW_SITE_URL: ${{ inputs.site_url }}
        run: |
          python3 - <<'PY'
          import os, re
          raw = os.environ['RAW_SITE_URL'].strip().rstrip('/')
          url = 'https://' + re.sub(r'^https?://', '', raw)
          lines = [
              '# Copy to .env.local for local Vercel development; set the same values in Vercel project settings.',
              f'SITE_URL={url}',
              'PUBLIC_POPULAR_ENABLED=false',
              'DATABASE_URL=',
              'PUBLIC_GISCUS_REPO=', 'PUBLIC_GISCUS_REPO_ID=', 'PUBLIC_GISCUS_CATEGORY=',
              'PUBLIC_GISCUS_CATEGORY_ID=', 'PUBLIC_GISCUS_MAPPING=pathname',
              'PUBLIC_SPONSOR_URL=', 'PUBLIC_SPONSOR_IMAGE_URL=', 'PUBLIC_ADSENSE_CLIENT=',
              'PUBLIC_ADSENSE_SLOT_STICKY=', 'PUBLIC_ADSENSE_SLOT_SIDEBAR=',
              'PUBLIC_ADSENSE_SLOT_INCONTENT=', 'PUBLIC_GA_ID=', 'PUBLIC_CF_BEACON_TOKEN=', 'PUBLIC_GSC_VERIFICATION=', '',
          ]
          open('.env.example', 'w', encoding='utf-8').write('\n'.join(lines))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'site_url={url}\n')
      - name: Remove project landing page
        run: |
          # Keep in sync with LANDING_PATHS in scripts/apply-template.ts —
          # forgetting src/pages/landing (docs routes) leaves files importing
          # the deleted ~/config/landing and breaks the fork's build.
          rm -rf src/components/landing src/config/landing.ts src/pages/landing.astro src/pages/landing src/pages/zh/landing.astro src/pages/zh/landing public/images/showcase public/images/wechat-qr.jpg
          sed -i.bak 's/landingLinkEnabled = true/landingLinkEnabled = false/' src/config/project.ts && rm -f src/config/project.ts.bak

      - name: Clear demo content and demo author
        if: ${{ inputs.clear_demo_content != 'false' }}
        run: |
          # Remove demo game articles (keep directory structure) + the demo
          # author registry entry, so no "Anvil Quest" / "Forge Master Kael"
          # residue ships with the fork. Demo artwork is removed BY NAME —
          # never a wildcard or a whole directory (src/assets/articles/ is
          # where fork authors put their own inline images). Keep this list in
          # sync with DEMO_COVERS / DEMO_ARTICLE_IMAGES
          # in scripts/lib/apply-rewrites.ts — pinned by
          # tests/apply-template.test.ts.
          find src/content/wiki -name '*.mdx' -delete
          rm -f src/assets/articles/weapon-frostpike.png \
                src/assets/articles/weapon-voidforge.png \
                src/assets/articles/beginner-guide-cover.png \
                src/assets/articles/emberfang-cover.png \
                src/assets/articles/stormcaller-cover.png \
                src/assets/articles/weapon-tier-list-cover.png \
                src/assets/articles/codes-cover.png \
                src/assets/articles/en-bosses-frostbound-monarch.png \
                src/assets/articles/en-guides-forging-guide.png \
                src/assets/articles/en-items-emberforged-armor-set.png \
                src/assets/articles/en-items-forging-materials-guide.png
          python3 - <<'EOF'
          import re
          p = 'src/config/authors.ts'
          s = open(p).read()
          # Drop the DEMO entry block (comment + 'Forge Master Kael' line).
          s = re.sub(r"\n\s*// DEMO .*?\n\s*'Forge Master Kael'.*?\n", '\n', s)
          open(p, 'w').write(s)
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # The init PR is destructive (landing removed, demo MDX deleted) and
      # PRs opened with GITHUB_TOKEN do NOT trigger CI — so the workflow
      # itself must prove the tree still builds before handing it to the
      # user. Catches file-list drift in the steps above, broken imports,
      # and schema violations; without this, a drift bug would only surface
      # on the fork's first Vercel deployment.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (verify the initialized tree is not broken)
        run: pnpm build
        env:
          SITE_URL: ${{ steps.vars.outputs.site_url }}

      - name: Create branch and pull request
        run: |
          git config user.name "gamewiki-template-setup"
          git config user.email "actions@github.com"
          # Idempotent re-runs: -B resets the branch instead of colliding with
          # the previous run's commits, --force-with-lease overwrites the remote
          # branch, and we skip commit/PR when there is nothing to change.
          git checkout -B chore/init-from-template
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit — template already initialized."
          else
            git commit -m "chore(init): apply template defaults (Vercel env, remove landing)"
          fi
          # The shallow checkout has no remote-tracking ref for the branch, so
          # --force-with-lease alone rejects idempotent re-runs ("stale info").
          git fetch origin chore/init-from-template || true
          git push --force-with-lease origin chore/init-from-template
          gh pr create --title "Initialize GameWikiSoleTemplate for your game" \
            --body "Automated by the Initialize GameWikiSoleTemplate workflow. .env.example set to ${SITE_URL_INPUT} (optional integrations cleared); project landing page removed. Next: run pnpm apply-template locally for game name / theme / locales, then import the repository into Vercel (docs/deployment.md)." \
            || echo "PR already exists — leaving the existing one open."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL_INPUT: ${{ inputs.site_url }}
